name: AcuGuide
# Reproducible project generation — run `xcodegen generate` (or `make`) to (re)create
# AcuGuide.xcodeproj from this spec. No more hand-assembling the project in Xcode.
options:
  bundleIdPrefix: app.acuguide
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    # Device build is signed by the developer's team; CLI `generic/platform=iOS`
    # builds with signing disabled so CI / `xcodebuild` works without a team.
    CODE_SIGN_STYLE: Automatic

packages:
  # Loads AcuGuide/Resources/model.glb at runtime (no usdz conversion) — the same asset as the
  # retired web atlas, archive/MaiApp/model.glb.
  # Binary xcframework, pinned for reproducibility.
  GLTFKit2:
    url: https://github.com/warrenm/GLTFKit2
    revision: be89e833aa85bde67bd27d4ecff3b7816c58ce56

targets:
  AcuGuide:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      # Everything except the pre-rendered voice clips, which need a folder reference (below).
      - path: AcuGuide
        excludes:
          - "VoiceClips"
      # FOLDER REFERENCE, not a group: a group would flatten all 102 clips into the .app root,
      # where they share one namespace with model.glb, the fonts and AcupointHead.mlmodelc (119
      # loose entries) and where `VoiceClips.url(for:)`'s `subdirectory: "VoiceClips"` lookup can
      # never resolve -- it only worked via the flat `??` fallback. This copies the directory
      # intact to AcuGuide.app/VoiceClips/, so the primary lookup is the one that answers.
      - path: AcuGuide/VoiceClips
        type: folder
        buildPhase: resources
    dependencies:
      - package: GLTFKit2
    # Generated Info.plist (so UIAppFonts — an array — can be declared; not expressible as an
    # INFOPLIST_KEY_* build setting). Regenerated by `xcodegen generate`; gitignored.
    info:
      path: AcuGuide/Info.plist
      properties:
        NSCameraUsageDescription: "AcuGuide uses the camera to guide your acupressure press."
        # Voice control on the camera screen — both hands are occupied pressing, so the few things
        # the user needs mid-session (confirm a spot, freeze the picture to read the guide, carry
        # on) can be SPOKEN instead of tapped. Prefers on-device recognition; falls back to Apple's
        # speech service when the on-device model isn't installed. The visible list of phrases
        # lives behind the "?" on the camera screen (VoiceCommandsView).
        NSMicrophoneUsageDescription: "AcuGuide can listen for a few short voice commands so you can confirm a spot or pause to read the guide without lifting your hands."
        NSSpeechRecognitionUsageDescription: "AcuGuide recognizes a few short spoken commands — confirming a pressure point, freezing the picture to read the guide, and carrying on — so you can use it with both hands busy. It uses on-device recognition when your device supports it, and Apple's speech service otherwise."
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        # The whole UI is bilingual at runtime (AppLocale.pick), but the bundle declared English
        # only, so the App Store listed the app as English-only and Chinese-language search never
        # surfaced it. CFBundleLocalizations is the store-facing (and system-facing) declaration of
        # supported languages; the strings switch at runtime, so no .lproj resources are needed.
        CFBundleLocalizations: [en, zh-Hans]
        UILaunchScreen: {}
        UIAppFonts:
          - MaShanZheng-Regular.ttf
          - CormorantGaramond.ttf
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.acuguide.ios
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"

  AcuGuideTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: AcuGuideTests
      # Ground-truth replay fixtures, referenced READ-ONLY from the repo (not copied/modified)
      # and bundled into the test target so CoachStateMachine can be driven frame-by-frame.
      - path: claude-deliverables/fixtures/fixture_1_te3_correct_good_rhythm.json
        buildPhase: resources
      - path: claude-deliverables/fixtures/fixture_2_te3_wrong_position.json
        buildPhase: resources
      - path: claude-deliverables/fixtures/fixture_3_pc6_correct_too_fast.json
        buildPhase: resources
      - path: claude-deliverables/fixtures/fixture_4_no_hand_then_partial.json
        buildPhase: resources
      - path: claude-deliverables/fixtures/fixture_5_te3_full_flow.json
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.acuguide.ios.tests
        GENERATE_INFOPLIST_FILE: YES
        # Match the app (iPhone-only). Without this the test bundle inherits XcodeGen's
        # iPhone+iPad default and disagrees with its own host.
        TARGETED_DEVICE_FAMILY: "1"
    dependencies:
      - target: AcuGuide
      # DetailSnapshotTests imports GLTFKit2 directly. It links today only because the host app
      # embeds the framework and Swift autolinks it — declare it so the dependency is explicit.
      - package: GLTFKit2

schemes:
  AcuGuide:
    build:
      targets:
        AcuGuide: all
        AcuGuideTests: [test]
    test:
      targets:
        - AcuGuideTests
